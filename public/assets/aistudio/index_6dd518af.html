<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questão de concordância verbal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="question-card">
    <h1 class="question-title">
      Assinale a alternativa em que a concordância<br class="desktop-break">
      verbal está incorreta.
    </h1>

    <form>
      <fieldset class="answers">
        <legend>Escolha uma:</legend>

        <label class="answer-option">
          <input type="radio" name="resposta" value="a">
          <span class="answer-text">a. Mais de um gerente se criticaram mutuamente durante a reunião do Conselho.</span>
        </label>

        <label class="answer-option">
          <input type="radio" name="resposta" value="b">
          <span class="answer-text">b. Muitos de nós resolveu sair da sala antes da conclusão da reunião.</span>
        </label>

        <label class="answer-option">
          <input type="radio" name="resposta" value="c">
          <span class="answer-text">c. Sou eu que recebo os participantes do torneio de futebol.</span>
        </label>

        <label class="answer-option">
          <input type="radio" name="resposta" value="d">
          <span class="answer-text">d. Sou eu quem recebe os participantes do torneio de futebol.</span>
        </label>

        <label class="answer-option">
          <input type="radio" name="resposta" value="e">
          <span class="answer-text">e. Mais de um candidato desistiu da eleição.</span>
        </label>
      </fieldset>
    </form>
  </main>
</body>
</html>
